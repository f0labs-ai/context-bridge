[package]
name = "cb-run"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Drives the services under test and writes run files."
build = "build.rs"

[lints]
workspace = true

[dependencies]
cb-types = { path = "../cb-types" }
serde.workspace = true
# raw_value: a service's answer is kept in the manifest exactly as it came.
# float_roundtrip: a score or a vector component read from a service is written back as the same number.
serde_json = { workspace = true, features = ["raw_value", "float_roundtrip"] }
thiserror.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
chrono.workspace = true
rand.workspace = true
rand_chacha.workspace = true
sha2.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
# The in-process stand-in for the services (tests/it/fake.rs): the same server stack the knowledge
# service itself is built on, so a multipart upload is read the way the real one reads it.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
tokio = { workspace = true, features = ["net"] }

[[bin]]
name = "cb-run"
path = "src/main.rs"
